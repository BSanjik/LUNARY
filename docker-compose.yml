#Контейнер для auth сервиса
services:
  api-gateway:
    container_name: lunary-gateway
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./services/api-gateway/.env
    depends_on:
      - auth-service
      - scenario-service
    networks:
      - lunary-network

  auth-service:
    container_name: lunary-auth
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    env_file:
    - ./services/auth-service/.env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/auth-service/migrations:/app/migrations
    command: ["./start.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - lunary-network

  scenario-service:
    container_name: lunary-scenario
    build:
      context: ./services/scenario-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    env_file:
      - ./services/scenario-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    volumes:
      - ./services/scenario-service/migrations:/app/migrations
    command: ["./start.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - lunary-network
      
  postgres:
    container_name: lunary-postgres
    image: postgres:15
    restart: always
    env_file:
      - ./.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - lunary-pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lunary-network 

volumes:
  lunary-pgdata:

networks:
  lunary-network: