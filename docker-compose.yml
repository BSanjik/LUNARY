#Контейнер для auth сервиса
services:
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: lunary-gateway
    ports:
      - "8080:8080"
    env_file:
      - ./services/api-gateway/.env
    depends_on:
      - auth-service
    networks:
      - lunary-network

  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: lunary-auth
    ports:
      - "8081:8081"
    env_file:
    - ./services/auth-service/.env
    depends_on:
      - postgres
    volumes:
      - ./services/auth-service/migrations:/app/migrations
    command: ["./start.sh"]
    networks:
      - lunary-network

  scenario-service:
    build:
      context: ./services/scenario-service
      dockerfile: Dockerfile
    container_name: lunary-scenario
    ports:
      - "8082:8082"
    environment:
      - DB_URL=postgres://postgres:mypassword@postgres:5432/lunary?sslmode=disable
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=lunary
      - DB_USER=postgres
      - DB_PASSWORD=mypassword
    depends_on:
      - postgres
      - auth-service
    volumes:
      - ./services/scenario-service/migrations:/app/migrations
    command: ["sh", "-c", "sleep 10 && echo '✅ Запускаем scenario-service...' && /app/scenario-service"]
    networks:
      - lunary-network
      
  postgres:
    image: postgres:15
    container_name: lunary-postgres
    restart: always
    environment:
      POSTGRES_DB: lunary
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    volumes:
      - lunary-pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lunary-network 

volumes:
  lunary-pgdata:

networks:
  lunary-network: