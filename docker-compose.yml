#Контейнер для auth сервиса
services:
  api-gateway:
    container_name: lunary-gateway
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./services/api-gateway/.env
    depends_on:
      - auth-service
      - scenario-service
    networks:
      - lunary-network

  auth-service:
    container_name: lunary-auth
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    env_file:
    - ./services/auth-service/.env
    depends_on:
      - postgres
    volumes:
      - ./services/auth-service/migrations:/app/migrations
    command: ["./start.sh"]
    networks:
      - lunary-network

  scenario-service:
    container_name: lunary-scenario
    build:
      context: ./services/scenario-service
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    env_file:
      - ./services/scenario-service/.env
    depends_on:
      - postgres
      - auth-service
    volumes:
      - ./services/scenario-service/migrations:/app/migrations
    command: ["sh", "-c", "sleep 10 && echo '✅ Запускаем scenario-service...' && /app/scenario-service"]
    networks:
      - lunary-network
      
  postgres:
    container_name: lunary-postgres
    image: postgres:15
    restart: always
    env_file:
      - ./.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - lunary-pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lunary-network 

volumes:
  lunary-pgdata:

networks:
  lunary-network: